<!DOCTYPE html>
<html lang="en" class="selection:bg-[#FF3E00] selection:text-white">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CART — CLOTH Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#FF3E00',
                        brandBlack: '#000000',
                        brandWhite: '#FFFFFF',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>

<body class="bg-brandWhite text-brandBlack font-sans antialiased overflow-x-hidden">
    <div class="cursor-follower"></div>
    <div class="spotlight-env"></div>

    <header id="header" class="fixed top-0 left-0 w-full z-50 border-b-grid backdrop-blur-md bg-white/70">
        <nav class="flex items-center justify-between px-6 py-4 md:px-12">
            <div class="flex items-center gap-8">
                <a href="index.html" class="text-2xl font-black tracking-tighter">CLOTH</a>
                <div class="hidden lg:flex gap-6 uppercase text-[10px] font-mono tracking-widest">
                    <a href="shop.html" class="hover:text-accent transition-colors">Shop</a>
                    <a href="index.html#trending" class="hover:text-accent transition-colors">Trending</a>
                    <a href="archive.html" class="hover:text-accent transition-colors">Archive</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="font-mono text-[10px] uppercase tracking-widest hidden sm:block">Registry / v.2026</div>
                <button id="menu-toggle" class="lg:hidden flex flex-col gap-1.5 p-2 z-[100]">
                    <span class="w-6 h-[1px] bg-black transition-transform"></span>
                    <span class="w-6 h-[1px] bg-black transition-transform"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-brandWhite z-[60] lg:hidden flex flex-col justify-center px-12 pt-24">
        <button id="close-menu"
            class="absolute top-8 right-8 p-4 flex items-center gap-4 font-mono text-[10px] uppercase tracking-widest opacity-40 hover:opacity-100 transition-opacity">
            Close
            <div class="relative w-6 h-6">
                <span class="absolute top-1/2 left-0 w-full h-[1px] bg-black rotate-45"></span>
                <span class="absolute top-1/2 left-0 w-full h-[1px] bg-black -rotate-45"></span>
            </div>
        </button>
        <div class="flex flex-col gap-8">
            <a href="shop.html" class="text-6xl font-black uppercase tracking-tighter hover:text-accent">Shop</a>
            <a href="index.html#trending"
                class="text-6xl font-black uppercase tracking-tighter hover:text-accent">Trending</a>
            <a href="archive.html" class="text-6xl font-black uppercase tracking-tighter hover:text-accent">Archive</a>
            <a href="cart.html" class="text-6xl font-black uppercase tracking-tighter hover:text-accent">Cart</a>
        </div>
    </div>

    <main class="pt-32 min-h-screen px-6 md:px-12">
        <div class="mb-12">
            <h1 class="text-6xl md:text-[10vw] font-black uppercase tracking-tighter leading-[0.8]">Your<br>Selection
            </h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 border-t-grid pt-12">
            <!-- Cart Items -->
            <div class="lg:col-span-8 flex flex-col gap-8 mb-24" id="cart-items-container">
                <!-- Items populated by JS -->
                <div class="flex items-center justify-center py-24 border border-dashed border-black/10">
                    <p class="font-mono text-xs opacity-40 uppercase tracking-widest">Initializing Secure Registry...
                    </p>
                </div>
            </div>

            <!-- Summary -->
            <div class="lg:col-span-4 bg-black text-white p-8 md:p-12 h-fit mb-24 reveal-3d">
                <h3 class="font-mono text-xs uppercase tracking-[0.3em] mb-12 border-b border-white/20 pb-4">Summary
                </h3>

                <div class="space-y-6 mb-12">
                    <div class="flex justify-between font-mono text-[10px] uppercase opacity-60">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="flex justify-between font-mono text-[10px] uppercase opacity-60">
                        <span>Shipping</span>
                        <span>$0.00 (Express)</span>
                    </div>
                    <div
                        class="flex justify-between font-mono text-xs font-bold uppercase pt-6 border-t border-white/10">
                        <span>Total Due</span>
                        <span id="cart-total" class="text-accent">$0.00</span>
                    </div>
                </div>

                <div class="flex flex-col gap-4">
                    <button
                        class="w-full bg-white text-black py-6 text-[10px] font-black uppercase tracking-[0.4em] hover:bg-accent hover:text-white transition-all duration-500">
                        Execute Checkout
                    </button>
                    <p class="text-[8px] font-mono opacity-20 uppercase text-center tracking-widest">
                        System authorized for secure transactions
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        const renderCart = () => {
            const container = document.getElementById('cart-items-container');
            const cart = getCart();

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-24 gap-8">
                        <p class="font-mono text-xs opacity-40 uppercase tracking-widest text-center leading-relaxed">
                            Registry empty.<br>Return to shop to add technical articles.
                        </p>
                        <a href="shop.html" class="border border-black px-8 py-3 text-[10px] font-mono uppercase tracking-widest hover:bg-black hover:text-white transition-all">
                            Back to Catalogue
                        </a>
                    </div>
                `;
                document.getElementById('cart-subtotal').textContent = '$0.00';
                document.getElementById('cart-total').textContent = '$0.00';
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="flex flex-col md:flex-row gap-8 pb-8 border-b border-black/10 group animate-reveal">
                    <div class="w-32 h-40 bg-[#fafafa] flex items-center justify-center p-4">
                        <img src="${item.img}" class="w-full h-full object-contain">
                    </div>
                    <div class="flex-1 flex flex-col justify-between">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-xl md:text-2xl font-black uppercase tracking-tight mb-2">${item.name}</h4>
                                <p class="font-mono text-[10px] opacity-40 uppercase tracking-widest">Size: ${item.size}</p>
                            </div>
                            <div class="font-mono text-sm font-medium">$${(item.price * item.quantity).toFixed(2)}</div>
                        </div>
                        <div class="flex items-center justify-between mt-auto">
                            <div class="flex items-center border border-black/10 overflow-hidden">
                                <button class="px-3 py-1 hover:bg-black hover:text-white transition-colors qty-minus" data-index="${index}">-</button>
                                <span class="px-4 py-1 font-mono text-xs border-x border-black/10">${item.quantity}</span>
                                <button class="px-3 py-1 hover:bg-black hover:text-white transition-colors qty-plus" data-index="${index}">+</button>
                            </div>
                            <button class="font-mono text-[8px] uppercase tracking-widest opacity-30 hover:opacity-100 hover:text-accent transition-all remove-item" data-index="${index}">
                                [ Remove Article ]
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            document.getElementById('cart-subtotal').textContent = `$${total.toFixed(2)}`;
            document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;

            // Attach listeners
            document.querySelectorAll('.qty-plus').forEach(btn => btn.addEventListener('click', () => updateQty(btn.dataset.index, 1)));
            document.querySelectorAll('.qty-minus').forEach(btn => btn.addEventListener('click', () => updateQty(btn.dataset.index, -1)));
            document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', () => removeItem(btn.dataset.index)));
        };

        const updateQty = (index, delta) => {
            let cart = getCart();
            cart[index].quantity += delta;
            if (cart[index].quantity < 1) cart[index].quantity = 1;
            saveCart(cart);
            renderCart();
            updateCartDisplay();
        };

        const removeItem = (index) => {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
            updateCartDisplay();
        };

        window.addEventListener('load', () => {
            renderCart();

            // Mobile Menu Logic
            const menuToggle = document.getElementById('menu-toggle');
            const closeMenu = document.getElementById('close-menu');
            const mobileMenu = document.getElementById('mobile-menu');
            const spans = menuToggle.querySelectorAll('span');
            const links = mobileMenu.querySelectorAll('a');

            const toggleMenu = (forceClose = false) => {
                const isActive = forceClose ? true : mobileMenu.classList.contains('active');

                if (isActive || forceClose) {
                    mobileMenu.classList.remove('active');
                    document.body.classList.remove('mobile-nav-open');
                    gsap.to(spans[0], { y: 0, rotate: 0, duration: 0.3 });
                    gsap.to(spans[1], { y: 0, rotate: 0, duration: 0.3 });
                } else {
                    mobileMenu.classList.add('active');
                    document.body.classList.add('mobile-nav-open');
                    gsap.to(spans[0], { y: 4, rotate: 45, duration: 0.3 });
                    gsap.to(spans[1], { y: -4, rotate: -45, duration: 0.3 });
                }
            };

            menuToggle.addEventListener('click', () => toggleMenu());
            closeMenu.addEventListener('click', () => toggleMenu(true));

            links.forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('active');
                    document.body.classList.remove('mobile-nav-open');
                    gsap.to(spans[0], { y: 0, rotate: 0, duration: 0.3 });
                    gsap.to(spans[1], { y: 0, rotate: 0, duration: 0.3 });
                });
            });
        });
    </script>
</body>

</html>
